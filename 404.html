<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>404 — Cognitive AI</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<meta name="robots" content="noindex" />
<style>
  :root{--fg:#fff;--dim:#6a6a6a;--c1:#f5f5f5;--c2:#9a9a9a;--c3:#d8d8d8;--c4:#6a6a6a}
  *{box-sizing:border-box}
  html,body{margin:0;background:#000;color:var(--fg)}
  body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
  .frame{max-width:520px;width:100%;position:relative;padding:44px 34px;border-radius:14px;border:2px solid transparent;background-clip:padding-box}
  .frame::before{content:"";position:absolute;inset:-2px;border-radius:14px;padding:2px;pointer-events:none;background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 22%,var(--c1) 45%,var(--c4) 68%,var(--c3) 88%,var(--c1) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  h1{font-size:clamp(26px,5vw,40px);margin:0 0 6px;text-shadow:0 0 6px rgba(255,255,255,.3)}
  p{color:var(--dim);margin:0 0 18px}
  a{color:var(--fg);text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.4)}
</style>
</head>
<body>
<main class="frame">
  <h1 class="glow">404</h1>
  <p>That page forgot where it was. Cognitive AI would have remembered.</p>
  <a href="/">← back home</a>
</main>
</body>
</html>
